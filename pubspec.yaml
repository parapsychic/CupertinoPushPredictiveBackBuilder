name: cupertino_predictive_back
description: >-
  Page transition that slides pages in like iOS on push and plays
  Android's predictive back animation when the user swipes back.
version: 1.0.0
repository: https://github.com/parapsychic/CupertinoPushPredictiveBackBuilder

topics:
  - navigation
  - animation
  - transitions
  - predictive-back

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
